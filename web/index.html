<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Casona Fundo El Castillo – Centro de eventos en Los Andes, Valparaíso. Historia, naturaleza y elegancia en un parque francés centenario de más de 80 años.">

  <!-- Open Graph / compartir en redes sociales -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Casona Fundo El Castillo">
  <meta property="og:description" content="Centro de eventos en Los Andes. Historia, naturaleza y elegancia en un parque francés centenario.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:locale" content="es_CL">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Casona Fundo El Castillo">
  <meta name="twitter:description" content="Centro de eventos en Los Andes. Historia, naturaleza y elegancia en un parque francés centenario.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Casona El Castillo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Casona Fundo El Castillo</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Formulario oculto para Netlify Forms (no se muestra al usuario) -->
  <form name="contacto" netlify netlify-honeypot="bot-field" hidden>
    <input type="text" name="nombre" />
    <input type="email" name="correo" />
    <textarea name="mensaje"></textarea>
  </form>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
